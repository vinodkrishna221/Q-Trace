<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Trace — Slide 2 (4 Quadrant Cards)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      color: #f8fafc;
    }
    .slide-wrapper {
      width: 1280px;
      height: 720px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .slide-header {
      height: 64px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e2e8f0;
      background: #fafafa;
    }
    .team-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 18px;
      border: 2px solid #4f46e5;
      border-radius: 20px;
      font-weight: 800;
      font-size: 15px;
      color: #4338ca;
      background: #eef2ff;
    }
    .slide-title-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 16px;
    }
    .brand-text {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .brand-tagline {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-left: 6px;
      padding-left: 8px;
      border-left: 2px solid #cbd5e1;
    }
    .sih-badge {
      font-weight: 900;
      font-size: 13px;
      color: #047857;
      text-align: right;
      line-height: 1.15;
      text-transform: uppercase;
    }
    .slide-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      padding: 16px 20px;
      background: #f1f5f9;
    }
    .card-slot {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .caption-box {
      margin-top: 14px;
      max-width: 1280px;
      width: 100%;
      background: #1e293b;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .caption-box strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="slide-wrapper">
    <header class="slide-header">
      <div class="team-badge">Bit-Storm · Q-Trace</div>
      <div class="slide-title-block">
        <div class="brand-icon">Q</div>
        <div class="brand-text">Q-Trace</div>
        <span class="brand-tagline">Build it · See it · Repair it</span>
      </div>
      <div class="sih-badge">Smart India<br>Hackathon 2026</div>
    </header>
    <main class="slide-grid">
      <div class="card-slot">
        <img src="assets/slide2_card1_challenges.jpg" alt="Quadrant 1: Challenges & Problems">
      </div>
      <div class="card-slot">
        <img src="assets/slide2_card3_innovation.jpg" alt="Quadrant 3: Innovation & Uniqueness">
      </div>
      <div class="card-slot">
        <img src="assets/slide2_card2_solution.jpg" alt="Quadrant 2: Proposed Solution">
      </div>
      <div class="card-slot">
        <img src="assets/slide2_card4_repair.jpg" alt="Quadrant 4: How it Addresses Problems">
      </div>
    </main>
  </div>
  <div class="caption-box">
    <strong>Slide 2 — Complete 4-Quadrant Visual Layout:</strong> Generated with high-impact UI screenshots, innovation pills, and 2-bullet takeaways per quadrant.
  </div>
</body>
</html>
