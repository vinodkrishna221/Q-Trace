# ==============================================================================
# Railway Root Deployment Configuration — Q-Trace API Service (SHIP-4)
# ==============================================================================
# Monorepo root configuration for Railway deploying the FastAPI backend.
# The single worker constraint is required: state is in-process (DEMO_LOCAL=1)
# or backed by Atlas (DEMO_LOCAL=0). Never scale to multiple workers without a
# shared session store.

[build]
builder = "NIXPACKS"
watchPatterns = ["apps/api/**"]

[deploy]
startCommand = "uv run --project apps/api uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ------------------------------------------------------------------------------
# Default variables for documentation — set actual production secrets in Railway UI
# ------------------------------------------------------------------------------
# WEB_ORIGIN=https://qtrace-web.vercel.app
# MONGODB_URI=mongodb+srv://<user>:<password>@cluster0.xxxxx.mongodb.net/?retryWrites=true&w=majority
# MONGODB_DB=qtrace_prod
# DEMO_LOCAL=0
# DEMO_FALLBACK=1
# ENABLE_QISKIT=1
# ENABLE_PENNYLANE=1
# ENABLE_TUTOR_CLOUD=0
# QTRACE_SIM_TIMEOUT_S=1.5
