# Railway deployment configuration for Q-Trace API service — SIM-8
# SHIP-4 will wire the Railway service variables; this config sets the
# process start command, health-check path and single-worker boundary.

[build]
builder = "NIXPACKS"

[deploy]
# Single worker: state is in-process (DEMO_LOCAL=1) or Atlas (DEMO_LOCAL=0).
# Never scale to multiple workers without a shared session store.
startCommand = "uv run --project . uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ---------------------------------------------------------------------------
# Environment variable defaults — overridden per-environment in Railway UI.
# These are documentation values only; secrets go in Railway Variables, not here.
# ---------------------------------------------------------------------------
# ENABLE_QISKIT=1         Primary adapter enabled
# ENABLE_PENNYLANE=1      Conformance adapter enabled
# ENABLE_TUTOR_CLOUD=0    Cloud Tutor disabled (offline-safe demo)
# DEMO_LOCAL=0            Use Atlas when deployed; 1 for venue fallback
# DEMO_FALLBACK=1         Cached responses active for scripted demo inputs
# QTRACE_SIM_TIMEOUT_S=1.5  Contract budget (do not raise above 2.0 on deploy)
